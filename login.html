<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIA'O - Login</title>
    <link rel="stylesheet" href="asset/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Fondo decorativo superior izquierdo -->
    <div class="bg-shape-top"></div>

    <!-- Navbar idéntico a tu captura -->
    <header class="navbar-container">
        <div class="navbar-content">
            <div class="nav-logo">FIA<span>'</span>O</div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link active" data-en="Home" data-es="Inicio">Home</a>
                <a href="about.html" class="nav-link" data-en="About Us" data-es="Sobre Nosotros">About Us</a>
                <a href="credit.html" class="nav-link" data-en="Credit" data-es="Crédito">Credit</a>
                <a href="products.html" class="nav-link" data-en="Products" data-es="Productos">Products</a>
                <a href="clients.html" class="nav-link" data-en="Clients" data-es="Clientes">Clients</a>
                <a href="reports.html" class="nav-link" data-en="Reports" data-es="Reportes">Reports</a>
                <a href="contact.html" class="nav-link" data-en="Contact" data-es="Contacto">Contact</a>
            </nav>
            <div class="nav-right-actions">
                <button id="lang-btn" class="action-pill-btn">ES</button>
                <button id="theme-btn" class="action-pill-btn">Theme</button>
            </div>
        </div>
    </header>

    <!-- Botón Back to Home -->
    <div class="back-btn-wrapper">
        <a href="index.html" class="back-home-btn" data-en="Back to Home" data-es="Volver al Inicio">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Fondo decorativo inferior derecho -->
    <div class="bg-shape-bottom"></div>

    <!-- Contenedor Principal -->
    <main class="main-content">
        <!-- Espacio reservado para la imagen de FIA'O superior -->
        <div class="brand-logo-box">
            <img src="asset/img/fiao-logo.png" alt="FIA'O" class="brand-image-placeholder">
        </div>

        <div class="login-card">
            <h1 data-en="Welcome Back!" data-es="¡Bienvenido de nuevo!">Welcome Back!</h1>
            <p class="subtitle" data-en="Sign in to continue with FIA'O" data-es="Inicia sesión para continuar con FIA'O">Sign in to continue with FIA'O</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="email" data-en="Email Address" data-es="Correo Electrónico">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password" data-en="Password" data-es="Contraseña">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="forgot-wrapper">
                    <a href="#" id="forgot-link" data-en="Forgot Password?" data-es="¿Olvidaste tu contraseña?">Forgot Password?</a>
                </div>

                <button type="submit" class="sign-in-submit-btn" data-en="Sign In" data-es="Iniciar Sesión">Sign In</button>

                <div class="or-divider">
                    <span>OR</span>
                </div>

                <button type="button" class="google-signin-btn">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> <span data-en="Continue with Google" data-es="Continuar con Google">Continue with Google</span>
                </button>

                <p class="signup-footer-text">
                    <span data-en="Don't have an account?" data-es="¿No tienes una cuenta?">Don't have an account?</span> 
                    <a href="register.html" data-en="Sign Up" data-es="Regístrate">Sign Up</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Modal Forgot Password -->
    <div id="forgot-modal" class="modal-backdrop">
        <div class="modal-card">
            <button class="modal-close" id="close-modal-btn">&times;</button>
            <h2 data-en="Reset Password" data-es="Restablecer Contraseña">Reset Password</h2>
            <p data-en="Enter your email address and we'll send you a verification code." data-es="Ingresa tu correo electrónico y te enviaremos un código de verificación.">Enter your email address and we'll send you a verification code.</p>
            
            <form id="forgot-form">
                <div class="input-group">
                    <label for="reset-email" data-en="Email Address" data-es="Correo Electrónico">Email Address</label>
                    <input type="email" id="reset-email" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="sign-in-submit-btn" data-en="Send Reset Code" data-es="Enviar Código">Send Reset Code</button>
            </form>
        </div>
    </div>

    <script src="asset/js/login.js"></script>
</body>
</html>
