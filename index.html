<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIA'O - Digital Notebook</title>
    <link rel="stylesheet" href="asset/css/index.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN FLOTANTE REDONDEADA -->
    <header class="navbar main-top-nav">
        <a href="index.html" class="logo">FIA<span class="yellow-text">'O</span></a>
        <nav class="nav-links">
            <a href="index.html" class="active" data-en="Home" data-es="Inicio">Home</a>
            <!-- Enlace ancla para deslizarse suavemente hasta la sección del About Us -->
            <a href="#about-section" data-en="About Us" data-es="Nosotros">About Us</a>
            <a href="#about-section" data-en="Credit" data-es="Créditos">Credit</a>
            <a href="#about-section" data-en="Products" data-es="Productos">Products</a>
            <a href="#about-section" data-en="Clients" data-es="Clientes">Clients</a>
            <a href="#about-section" data-en="Reports" data-es="Reportes">Reports</a>
        </nav>

        <div class="nav-actions">
            <button id="langToggle" class="nav-btn-icon"><span id="langLabel">ES</span></button>
            <button id="themeToggle" class="nav-btn-icon">Theme</button>
            <div id="userNavArea"></div>
        </div>
    </header>

    <!-- HERO SECTION CON CARRUSEL -->
    <main class="hero-carousel-container">
        <div class="hero-content">
            <h1 class="hero-title" data-en='Your <span class="highlight-credit">credit</span> notebook, now digital.' data-es='Tu libreta de <span class="highlight-credit">crédito</span>, ahora digital.'>
                Your <span class="highlight-credit">credit</span> notebook, now digital.
            </h1>
            
            <p class="hero-subtitle" id="carouselSubtitle" 
               data-en="Digitize customer, debt, and payment management for convenience stores in Panama." 
               data-es="Digitaliza la gestión de clientes, deudas y pagos para minisupermercados en Panamá.">
                Digitize customer, debt, and payment management for convenience stores in Panama.
            </p>
            
            <div class="hero-buttons">
                <a href="login.html" class="btn-primary-yellow" data-en="Login" data-es="Iniciar Sesión">Login</a>
                <a href="register.html" class="btn-primary-yellow" data-en="Sign up" data-es="Registrarse">Sign up</a>
            </div>

            <div class="carousel-dots">
                <span class="dot active" onclick="currentSlide(0)"></span>
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
            </div>
        </div>

        <div class="hero-image-side">
            <img id="carouselImage" src="asset/img/movil.png" alt="FIA'O App Preview" class="carousel-img" 
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/340x600?text=FIA%27O+App+Preview';">
        </div>
    </main>

    <!-- SECCIÓN DONDE SE INCRUSTA EL ARCHIVO ABOUT.HTML ABAJO DEL INDEX -->
    <section id="about-section" class="iframe-section">
        <iframe src="about.html" class="about-iframe" scrolling="no" id="aboutFrame"></iframe>
    </section>

    <script src="asset/js/index.js"></script>
</body>
</html>
